services:
  vulnerable:
    build: ./vulnerable
    ports:
      - "8000:8000"
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      - LLM_API_KEY=${LLM_API_KEY:-ollama}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:7b}
      - MODE=vulnerable
    volumes:
      - ./evil_docs:/app/docs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  secure:
    build: ./secure
    ports:
      - "8001:8000"
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      - LLM_API_KEY=${LLM_API_KEY:-ollama}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:7b}
      - MODE=secure
    volumes:
      - ./evil_docs:/app/docs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
