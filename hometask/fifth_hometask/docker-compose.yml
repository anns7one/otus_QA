services:
  vulnerable:
    build: ./vulnerable
    ports:
      - "8100:8000"
    volumes:
      - ./evil_docs:/app/docs
    environment:
      - LLM_BASE_URL=http://host.docker.internal:11434/v1
      - LLM_API_KEY=ollama
      - LLM_MODEL=qwen2.5:7b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  secured:
    build: ./secured
    ports:
      - "8101:8001"
    volumes:
      - ./evil_docs:/app/docs
    environment:
      - LLM_BASE_URL=http://host.docker.internal:11434/v1
      - LLM_API_KEY=ollama
      - LLM_MODEL=qwen2.5:7b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
